[package]
name = "crabmander"
version = "1.0.0"
edition = "2024"
description = "A twin-pane TUI file manager written in Rust using Ratatui."
authors = ["Tommie Nygren <tommie.nygren@gmail.com>"]
build = "build.rs"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.5.20", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6.5"
config = "0.15.25"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
git2 = "0.21.0"
human-panic = "2.0.8"
json5 = "1.3.1"
lazy_static = "1.5.0"
libc = "0.2.186"
ratatui = { version = "0.30.2", features = ["serde", "macros"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
strip-ansi-escapes = "0.2.1"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }
opaline = "0.4.1"
notify = { version = "9.0.0-rc.4", features = ["macos_kqueue"] }
zip = "9.0.0-pre3"
tar = "0.4.46"
flate2 = "1"
bzip2 = "0.6.1"
xz2 = "0.1.7"
zstd = "0.13"

[dev-dependencies]
pretty_assertions = "1.4.1"

[build-dependencies]
anyhow = "1.0.104"
vergen-gix = { version = "9.1.0", features = ["build", "cargo"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
