#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "check"
env.CARGO_TERM_COLOR = "always"

# Plain cargo on purpose: no `+toolchain`, codegen backend, wrapper or RUSTFLAGS overrides here.
# The toolchain comes from ../rust-toolchain.toml, build settings live in Cargo.toml profiles
# (and kache in ~/.cargo/config.toml), so these jobs share build artifacts with rust-analyzer,
# agents and plain `cargo` runs.

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy"]
need_stdout = false

# Same flags as CI: lints lib, bin and tests with all features.
[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets", "--all-features"]
need_stdout = false

# This job lets you run
# - all tests: bacon test
# - a specific test: bacon test -- config::test_default_files
[jobs.test]
command = ["cargo", "test"]
need_stdout = true

[jobs.nextest]
command = ["cargo", "nextest", "run", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

[jobs.nextest-cov]
command = [
    "sh", "-c",
    "out=$(cargo llvm-cov nextest --hide-progress-bar --failure-output final 2>&1); s=$?; printf '%s\\n' \"$out\" | awk -v failed=$s '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%-40s\\n\",\"----------------------------------------\"; next} /^-+$/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} failed{print}'"
]
need_stdout = true
analyzer = "nextest"

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

# If the doc compiles, then it opens in your browser and bacon switches
# to the previous job
[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
need_stdout = false
on_success = "back" # so that we don't open the browser at each change

[jobs.run]
command = [
    "cargo", "run",
    # put launch parameters for your program behind a `--` separator
]
need_stdout = true
allow_warnings = true
background = true

[keybindings]
c = "job:clippy-all"
t = "job:nextest"
v = "job:nextest-cov"
